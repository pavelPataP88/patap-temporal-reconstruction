name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
          test -f dist/*.whl
          test -f dist/*.tar.gz
      - name: Verify installed wheel outside checkout
        run: |
          python -c "import glob, zipfile; names = set(zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()); required = {'patap/__init__.py', 'patap/engine.py', 'patap/models.py', 'patap/memory.py', 'patap/cli.py'}; assert required <= names, required - names"
          python -m venv /tmp/patap-venv
          /tmp/patap-venv/bin/python -m pip install --no-deps dist/*.whl
          mkdir -p /tmp/patap-smoke
          cd /tmp/patap-smoke
          /tmp/patap-venv/bin/python -c "from patap import PATAP, PATAPMemory; memory = PATAPMemory(); memory.record('requirements'); memory.record('schema', depends_on=['requirements']); memory.record('api', depends_on=['schema']); context = memory.context_for('api'); assert context['present'] == 'api'; assert set(context['past']) == {'requirements', 'schema'}; assert context['future'] == 'unknown_by_design'; print('PATAP import OK')"
          /tmp/patap-venv/bin/patap --help
          /tmp/patap-venv/bin/patap analyze "$GITHUB_WORKSPACE/examples/simple_history.json"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Benchmark smoke test
        if: matrix.python-version == '3.11'
        run: python benchmarks/run_context_benchmark.py
